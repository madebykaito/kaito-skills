# Set TWENTY_DB_PASSWORD, TWENTY_APP_SECRET and TWENTY_ENCRYPTION_KEY first.
services:
  server:
    image: twentycrm/twenty:${TWENTY_TAG:-latest}
    ports:
      - "127.0.0.1:${TWENTY_PORT:-3319}:3000"
    environment: &twenty-env
      PG_DATABASE_URL: postgres://twenty:${TWENTY_DB_PASSWORD:?set TWENTY_DB_PASSWORD}@db:5432/twenty
      SERVER_URL: http://localhost:${TWENTY_PORT:-3319}
      REDIS_URL: redis://redis:6379
      STORAGE_TYPE: local
      APP_SECRET: ${TWENTY_APP_SECRET:?set TWENTY_APP_SECRET}
      ENCRYPTION_KEY: ${TWENTY_ENCRYPTION_KEY:?set TWENTY_ENCRYPTION_KEY}
    volumes:
      - storage:/app/packages/twenty-server/.local-storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 40
  worker:
    image: twentycrm/twenty:${TWENTY_TAG:-latest}
    command: ["yarn", "worker:prod"]
    environment:
      <<: *twenty-env
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes:
      - storage:/app/packages/twenty-server/.local-storage
    depends_on:
      server:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: twenty
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: ${TWENTY_DB_PASSWORD:?set TWENTY_DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twenty -d twenty"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  storage:
  database:
