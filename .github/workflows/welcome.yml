name: Welcome
# pull_request_target so it can comment on fork PRs. Safe: it never checks out PR code.
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
permissions:
  issues: write
  pull-requests: write
jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          issue_message: |
            Thanks for opening your first issue here. The maintainer replies within 7 days. If it is about a skill, the prompt you used and the agent's reply help a lot.
          pr_message: |
            Thanks for your first PR. Please check the boxes in the template and make sure CI is green. See [CONTRIBUTING.md](https://github.com/madebykaito/kaito-skills/blob/main/CONTRIBUTING.md). The maintainer replies within 7 days.
