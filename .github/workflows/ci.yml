name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tests
        run: tests/run.sh
      - name: Privacy scan
        if: matrix.os == 'ubuntu-latest'
        run: node tools/privacy-scan.mjs
      - name: Install smoke test
        run: tests/smoke.sh
      - name: Routes
        run: |
          out=$(helpmekaito/scripts/check-routes.sh); echo "$out"
          echo "$out" | grep -qx 'routes ok'

  alpine:
    name: test (alpine)
    runs-on: ubuntu-latest
    container: node:22-alpine
    steps:
      - name: Tools
        shell: sh
        run: apk add --no-cache bash git curl python3 util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests
        shell: sh
        run: git config --global --add safe.directory "$PWD" && tests/run.sh
      - name: Install smoke test
        shell: sh
        run: tests/smoke.sh
