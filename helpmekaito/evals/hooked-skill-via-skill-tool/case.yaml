schema_version: "1.1"
name: hooked-skill-via-skill-tool
expected_outcome: |
  Fallback test. Never reads careful's SKILL.md by path. Where careful is installed it goes through the Skill tool;
  in the eval sandbox it is not, so the reply tells the user to type /careful. This does not prove the hook runs.
# Known failure when Bash is granted (router, not grader): the model never tries the Skill tool for careful.
# It greps references, runs kaito-path.sh, sees no ~/.kaito store, and says "run ./setup" instead of
# attempting Skill(careful) and telling the user to type /careful. Without Bash it passed once.
# Fix needs a SKILL.md edit (step 5, "Skill tool available"), which evals/ cannot make. Graders left as is.
